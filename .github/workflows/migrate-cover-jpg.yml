name: One-Time JPEG Artwork Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/migrate_svg_to_jpg.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jpeg-artwork-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - name: Install image converters
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: CairoSVG==2.8.2
      - name: Convert all artwork to JPEG
        run: python .github/scripts/migrate_svg_to_jpg.py
      - name: Ensure FFmpeg tools for media regression tests
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Validate generated JPEG assets, catalogs and regression tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
          python scripts/check_world_radio.py
          python scripts/check_language_radio.py
          python scripts/build_us_directory.py --validate
          python scripts/generate_world_covers.py --verify
          test "$(find Covers world-radio us-directory -name '*.svg' | wc -l)" -eq 0
      - name: Publish JPG conversion to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Covers/ world-radio/ us-directory/ scripts/ tests/ README.md ARTWORK_LICENSE.md docs/ requirements.txt .github/workflows/world-artwork.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Migrate all radio artwork and references from SVG to JPG'
          git fetch origin main
          git rebase origin/main
          askpass="$RUNNER_TEMP/jpg-migration-askpass"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          for attempt in 1 2 3; do
            if GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done
          echo 'Migration push failed without overwriting concurrent changes'
          exit 1
