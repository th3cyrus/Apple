name: World Radio Select Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'world-radio/**'
      - 'scripts/check_world_radio.py'
      - 'tests/test_world_radio.py'
      - '.github/workflows/world-radio.yml'
  push:
    branches: [main]
    paths:
      - 'world-radio/**'
      - 'scripts/check_world_radio.py'
      - '.github/workflows/world-radio.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 6'

permissions:
  contents: read

concurrency:
  group: world-radio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'

      - name: Install requirements
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Offline validation and regression tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_world_radio.py

      - name: Audit decoded live audio
        run: python scripts/check_world_radio.py --audit --output logs/world-radio-audit.json --workers 12

      - name: Upload world audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: world-radio-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/world-radio-audit.json
          if-no-files-found: warn
          retention-days: 30
