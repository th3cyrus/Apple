name: Primuse Radio Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 3'

permissions:
  contents: write

concurrency:
  group: primuse-radio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh radio stations and playlist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update.py --publish --refresh

      - name: Validate stations, covers, and playlist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image

          stations = json.loads(
              Path('stations.json').read_text(encoding='utf-8')
          )

          if not isinstance(stations, list) or len(stations) < 35:
              raise SystemExit('Station catalog is missing or incomplete')

          ids = [station.get('id') for station in stations]

          if any(not isinstance(id_, str) or not id_ for id_ in ids):
              raise SystemExit('Invalid station ID')

          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate station IDs')

          for station in stations:
              url = station.get('stream')

              if (
                  not isinstance(url, str)
                  or urlsplit(url).scheme not in ('http', 'https')
                  or not urlsplit(url).hostname
              ):
                  raise SystemExit(
                      f"Invalid stream URL for {station.get('name')}"
                  )

              cover = Path('logos') / f"{station['id']}.png"

              if not cover.is_file():
                  raise SystemExit(f'Missing cover: {cover}')

              with Image.open(cover) as image:
                  image.verify()

          lines = [
              line.strip()
              for line in Path('radio.m3u').read_text(
                  encoding='utf-8'
              ).splitlines()
              if line.strip()
          ]

          if not lines or lines[0] != '#EXTM3U':
              raise SystemExit('Invalid M3U header')

          if sum(
              line.startswith('#EXTINF:') for line in lines
          ) != len(stations):
              raise SystemExit('Playlist station count mismatch')

          urls = [
              line for line in lines
              if not line.startswith('#')
          ]

          if urls != [station['stream'] for station in stations]:
              raise SystemExit(
                  'Playlist URLs do not match stations.json'
              )

          health_log = Path('logs/stream-health.jsonl')
          if not health_log.is_file():
              raise SystemExit('Missing stream diagnostics report')
          latest = json.loads(health_log.read_text(encoding='utf-8').splitlines()[-1])
          if latest.get('summary', {}).get('total') != len(stations):
              raise SystemExit('Stream diagnostics missing station results')

          print(
              f'Validated {len(stations)} stations, covers, playlist and diagnostics'
          )
          PY

      - name: Upload stream health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-health-${{ github.run_id }}
          path: logs/stream-health.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit refreshed files if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add radio.m3u stations.json logos/ logs/

          if ! git diff --cached --quiet; then
            git commit -m 'Refresh radio playlist'
            git push
          fi
