name: Primuse Radio Refresh

on:
  push:
    branches: [main]
    paths:
      - 'stations.json'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/import.yml'
  workflow_dispatch:
    inputs:
      report_only:
        description: Check audio and save diagnostics without publishing changes
        type: boolean
        default: false
  schedule:
    # 06:17 Asia/Baghdad (UTC+03:00).
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: primuse-radio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'

      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Ensure media verification tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Run regression tests and validate maintained files
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Refresh radio stations and playlist
        id: refresh
        env:
          REPORT_ONLY: ${{ inputs.report_only }}
          PYTHONUNBUFFERED: '1'
        run: |
          args=(--publish --refresh)
          if [ "$REPORT_ONLY" = "true" ]; then
            args+=(--report-only)
          fi
          python scripts/update.py "${args[@]}"

      - name: Validate published files and current-run diagnostics
        run: python scripts/validate.py --report logs/current-run.json

      - name: Summarize current diagnostics
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('logs/current-run.json')
          if path.is_file():
              report = json.loads(path.read_text(encoding='utf-8'))
              if report.get('github_run_id') != os.environ['GITHUB_RUN_ID']:
                  raise SystemExit('Refusing diagnostics from a different run')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('### Stream health\n\n')
                  output.write('Run status: ' + report['status'] + '\n\n')
                  output.write('| Result | Count |\n| --- | ---: |\n')
                  for key, value in report['summary'].items():
                      output.write(f'| {key} | {value} |\n')
          PY

      - name: Upload this run's stream health diagnostics
        if: always() && steps.refresh.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stream-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/current-run.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit refreshed files if changed
        if: inputs.report_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u stations.json logos/ logs/stream-health.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh radio playlist'
          # Credentials exist only in this publishing step, never in checkout config.
          askpass="$RUNNER_TEMP/primuse-git-askpass"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
