name: Primuse Import and Refresh

on:
  push:
    paths:
      - 'Primuse_Apple_Import.zip'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 3'

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract project in repository root
        run: |
          python - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('Primuse_Apple_Import.zip')
          with ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError(f'Unsafe ZIP path: {member.filename}')
              bundle.extractall('.')
          archive.unlink()
          PYTHON
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Publish station artwork URLs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update.py --publish
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import Primuse project'
            git push
          fi

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh radio station playlist and covers
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update.py --publish --refresh
      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio.m3u stations.json logos/
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-refresh radio playlist and artwork'
            git push
          fi
