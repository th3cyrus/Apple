name: U.S. Radio Directory Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_us_directory.py'
      - '.github/workflows/us-directory.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_us_directory.py'
      - '.github/workflows/us-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate workflow loading
        run: echo "Workflow configuration loaded"
