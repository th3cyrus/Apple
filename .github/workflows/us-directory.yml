name: U.S. Radio Directory Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_us_directory.py'
      - '.github/workflows/us-directory.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_us_directory.py'
      - '.github/workflows/us-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Ensure media verification tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Test repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Build U.S. directory
        run: python scripts/build_us_directory.py

      - name: Report station count
        run: python -c "import json; print(json.load(open('us-directory/index.json'))['station_count'])"
