name: U.S. Radio Directory Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_us_directory.py'
      - '.github/workflows/us-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

# Serialize with curated playlist refresh so the two publishing jobs don't race.
concurrency:
  group: primuse-radio-refresh
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'

      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt

      - name: Validate generator and curated playlist
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Build complete U.S. directory shards
        run: python scripts/build_us_directory.py

      - name: Publish directory if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add us-directory/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh U.S. radio directory'
          # Rebase on the latest main in case another radio workflow committed.
          git fetch origin main
          git rebase origin/main
          askpass="$RUNNER_TEMP/primuse-us-directory-askpass"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
